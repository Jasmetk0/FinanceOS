name: CI

on:
  pull_request:
    branches:
      - buuk
  push:
    branches:
      - buuk

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Correctness regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production server smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "npm run start -- --hostname 127.0.0.1" -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:3000/api/health" -TimeoutSec 2
                if ($health.ok -eq $true -and $health.app -eq "FinanceOS") {
                  $ready = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Milliseconds 750
            }

            if (-not $ready) {
              throw "FinanceOS production server did not become ready."
            }

            $homeResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3000/" -TimeoutSec 15
            if ($homeResponse.StatusCode -ne 200) {
              throw "FinanceOS dashboard returned HTTP $($homeResponse.StatusCode)."
            }
          } finally {
            & taskkill.exe /PID $process.Id /T /F *> $null
          }

      - name: SQLite runtime smoke test
        shell: pwsh
        run: |
          node -e "const { DatabaseSync } = require('node:sqlite'); const db = new DatabaseSync(':memory:'); db.exec('CREATE TABLE smoke(id INTEGER); INSERT INTO smoke VALUES (1);'); const row = db.prepare('SELECT id FROM smoke').get(); if (row.id !== 1) process.exit(1); db.close();"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }

          if ($failed) {
            exit 1
          }
